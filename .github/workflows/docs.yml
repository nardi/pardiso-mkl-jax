name: Documentation
on:
  push:
    branches:
      - main
permissions:
  contents: read
  pages: write
  id-token: write
  # deploy-pages looks up the uploaded artifact through the Actions API, which
  # needs read access on actions. Without it the lookup returns zero artifacts.
  actions: read
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      # --no-editable installs the compiled extension as real files rather
      # than through the meson-python editable loader, which mkdocstrings'
      # static analysis (via griffe) cannot resolve import aliases through.
      - run: uv sync --group docs --no-editable
      - run: uv run --no-sync zensical build --clean
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
