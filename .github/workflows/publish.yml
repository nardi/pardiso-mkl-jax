name: Publish
on:
  release:
    types: [published]
jobs:
  build_wheels:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # On Linux this builds inside a manylinux container and repairs the
      # result with auditwheel; on Windows it repairs with delvewheel
      # instead. Both per [tool.cibuildwheel] in pyproject.toml, so the
      # uploaded wheels are installable on any compatible system rather than
      # only on the runner's own toolchain.
      - uses: pypa/cibuildwheel@v4.1.0
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build_sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      # `uv build` needs meson-python, Cython, and mkl-devel importable, since
      # [tool.uv].no-build-isolation-package disables build isolation for
      # this package and reuses the active environment instead, so sync the
      # dev group into .venv first rather than relying on an isolated build
      # env that's never created.
      - run: uv sync --group dev
      - run: uv build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Required for PyPI trusted publishing (OIDC), which needs no API
      # token but does need a "pypi" trusted publisher configured for this
      # repository under the project's PyPI settings beforehand.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: dist/
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
