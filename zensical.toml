[project]
site_name = "pardiso-mkl-jax"
site_description = "JAX-compatible interface to the oneMKL Pardiso direct sparse solver."
site_author = "nardi"
site_url = "https://nardi.github.io/pardiso-mkl-jax/"
copyright = """
Copyright &copy; 2026 nardi
"""

nav = [
  { "Home" = "index.md" },
  { "Installation" = "user-guide/installation.md" },
  { "Basic usage" = "user-guide/basic-usage.md" },
  { "Advanced usage" = "user-guide/advanced-usage.md" },
  { "API reference" = "reference.md" },
]

# The dropdown of the page title that switches to the other documentation sites,
# which the theme lists by default.
[project.extra.site_switcher]
current = "pardiso-mkl-jax"

[project.theme]
language = "en"
# The Tufte theme comes from the `theme` submodule and extends the built-in theme. It
# loads its own fonts, so the built-in theme loads none from Google Fonts.
custom_dir = "theme/zensical_tufte"
font = false
features = [
    "content.code.copy",
    "navigation.footer",
    "navigation.top",
    "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/nardi/pardiso-mkl-jax"

# The directory of the theme contains two files of its Python packaging, which the site
# does not need.
[project.plugins.exclude]
glob = ["mkdocs_theme.yml", "__init__.py", "__pycache__/*"]

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions."zensical.extensions.mkdocstrings"]
