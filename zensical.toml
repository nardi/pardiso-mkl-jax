[project]
site_name = "pardiso-mkl-jax"
site_description = "JAX-compatible interface to the oneMKL Pardiso direct sparse solver."
site_author = "nardi"
site_url = "https://nardi.github.io/pardiso-mkl-jax/"
copyright = """
Copyright &copy; 2026 nardi
"""

nav = [
  { "Home" = "index.md" },
  { "Installation" = "user-guide/installation.md" },
  { "Basic usage" = "user-guide/basic-usage.md" },
  { "Advanced usage" = "user-guide/advanced-usage.md" },
  { "API reference" = "reference.md" },
]

[project.theme]
language = "en"
features = [
    "content.code.copy",
    "navigation.footer",
    "navigation.top",
    "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/nardi/pardiso-mkl-jax"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions."zensical.extensions.mkdocstrings"]
