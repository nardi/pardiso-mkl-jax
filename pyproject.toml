[build-system]
build-backend = "mesonpy"
requires = [
    "meson-python>=0.16",
    "Cython>=3.0",
    # Headers and import libraries needed to compile against MKL. The mkl
    # runtime package is pulled in transitively, and is also declared as a
    # runtime dependency below since the compiled extension needs it after
    # installation too, not just while building.
    "mkl-devel>=2024",
    # jaxlib ships the XLA FFI headers the extension compiles against, and
    # jax.ffi.include_dir() (queried from meson.build) is how their location
    # is discovered, so jax itself must be present in the build environment.
    "jax>=0.10",
]

[project]
name = "pardiso-mkl-jax"
version = "0.1.0"
description = "JAX-compatible interface to the oneMKL Pardiso direct sparse solver"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "nardi" }]
dependencies = [
    "jax>=0.10",
    "numpy>=1.26",
    "scipy>=1.11",
    "mkl>=2024",
]

[project.urls]
Homepage = "https://github.com/nardi/pardiso-mkl-jax"
Documentation = "https://nardi.github.io/pardiso-mkl-jax"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-markdown-docs>=0.6",
    "ruff>=0.6",
    # Build tools are also listed here, matching [build-system].requires,
    # so they land in .venv itself rather than only in a throwaway build
    # environment. This project builds with build isolation disabled (see
    # [tool.uv] below), because a meson-python editable install recompiles
    # on every import, and that recompile needs these same header and
    # library paths to still exist afterward, not just during the original
    # `uv sync`.
    "meson>=1.3",
    "ninja>=1.11",
    "meson-python>=0.16",
    "Cython>=3.0",
    "mkl-devel>=2024",
    "ty>=0.0.1a1",
]
docs = [
    "zensical",
    "mkdocstrings[python]>=0.26",
]

[tool.uv]
# See the comment in the dev dependency group above for why.
no-build-isolation-package = ["pardiso-mkl-jax"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
