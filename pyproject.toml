[build-system]
build-backend = "mesonpy"
requires = [
    "meson-python>=0.16",
    "Cython>=3.0",
    # Headers and import libraries needed to compile against MKL. The mkl
    # runtime package is pulled in transitively, and is also declared as a
    # runtime dependency below since the compiled extension needs it after
    # installation too, not just while building.
    "mkl-devel>=2024",
    # jaxlib ships the XLA FFI headers the extension compiles against, and
    # jax.ffi.include_dir() (queried from meson.build) is how their location
    # is discovered, so jax itself must be present in the build environment.
    "jax>=0.10",
]

[project]
name = "pardiso-mkl-jax"
version = "0.2.2"
description = "JAX-compatible interface to the oneMKL Pardiso direct sparse solver"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Nardi Lam", email = "mail@nardilam.nl" }]
dependencies = [
    "jax>=0.10",
    "numpy>=1.26",
    "scipy>=1.11",
    "mkl>=2024",
    # Used only for equinox.error_if, so the upper-triangular structure
    # check in matrix.py can still raise at runtime when indptr and indices
    # are traced under jit or vmap, instead of being silently skipped.
    "equinox>=0.11",
]

[project.urls]
Homepage = "https://github.com/nardi/pardiso-mkl-jax"
Documentation = "https://nardi.github.io/pardiso-mkl-jax"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-markdown-docs>=0.6",
    "ruff>=0.6",
    # Build tools are also listed here, matching [build-system].requires,
    # so they land in .venv itself rather than only in a throwaway build
    # environment. This project builds with build isolation disabled (see
    # [tool.uv] below), because a meson-python editable install recompiles
    # on every import, and that recompile needs these same header and
    # library paths to still exist afterward, not just during the original
    # `uv sync`.
    "meson>=1.3",
    "ninja>=1.11",
    "meson-python>=0.16",
    "Cython>=3.0",
    "mkl-devel>=2024",
    "ty>=0.0.1a1",
]
docs = ["zensical", "mkdocstrings[python]>=0.26"]

[tool.uv]
# See the comment in the dev dependency group above for why.
no-build-isolation-package = ["pardiso-mkl-jax"]

[tool.meson-python.args]
# --vsenv is a no-op on non-Windows (meson checks is_windows() before doing
# anything). On Windows it locates and activates the Visual Studio
# environment via vswhere/vcvars, even when a gcc/clang is already on PATH
# (e.g. from MSYS2 or Git Bash), so the extension always links against MSVC
# rather than against MinGW's own libgcc/libstdc++/libwinpthread runtime
# DLLs, which aren't guaranteed to be present on the end user's machine.
setup = ["--vsenv"]

[tool.cibuildwheel]
# The mkl PyPI wheels are only published for Linux and Windows (x86_64), so
# only those platforms are built.
build = "{cp311-manylinux_x86_64,cp312-manylinux_x86_64,cp313-manylinux_x86_64,cp311-win_amd64,cp312-win_amd64,cp313-win_amd64}"
test-requires = "pytest"
test-command = "pytest {project}/tests"

[tool.cibuildwheel.linux]
# libmkl_rt is loaded explicitly at runtime from the separately installed
# mkl runtime package (see _mkl_loader.py), not linked into the wheel, so
# auditwheel must be told to leave it out rather than vendor a copy of it
# into the wheel.
repair-wheel-command = "auditwheel repair --exclude libmkl_rt.so.3 -w {dest_dir} {wheel}"

[tool.cibuildwheel.windows]
# Same idea as the Linux repair command above, but delvewheel is the
# Windows equivalent of auditwheel, and mkl_rt's DLL is versioned
# (mkl_rt.<major>.dll) rather than named exactly like the import library.
repair-wheel-command = "delvewheel repair --exclude mkl_rt.*.dll -w {dest_dir} -v {wheel}"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
